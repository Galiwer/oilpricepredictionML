version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oilpriceprediction-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./models:/app/models
      - ./reports:/app/reports
      - ./data:/app/data:ro
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oilpriceprediction-streamlit
    command: streamlit run streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./models:/app/models
      - ./reports:/app/reports
      - ./data:/app/data:ro
    restart: unless-stopped
